name: 订阅源自动维护

# 定时触发用 UTC 时间，'0 0 * * *' = 北京时间每天 08:00
# workflow_dispatch 允许在网页上手动点「Run workflow」立即跑一次
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  # 网页提交新源：在 GitHub 上编辑 manual_sources.txt 并 commit 后自动跑一次
  push:
    branches:
      - main
    paths:
      - 'manual_sources.txt'

# 允许把生成的订阅提交回仓库（GitHub 新仓库默认只读，必须显式开启）
permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 检出到 main 分支而非游离 HEAD，否则最后 git push 会失败
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 主源清单通过 Secret 注入（含成人站，不进仓库）；手工源直接读仓库里的 manual_sources.txt
      - name: 注入真实源（私密变量）
        env:
          SOURCES_B64: ${{ secrets.SOURCES_B64 }}
        run: |
          echo "SOURCES_B64 长度: ${#SOURCES_B64}"
          if [ -z "$SOURCES_B64" ]; then
            echo "ERROR: SOURCES_B64 未配置。请到 Settings -> Secrets and variables -> Actions 添加。"
            exit 1
          fi
          echo "$SOURCES_B64" | base64 -d > sources.txt
          echo "sources.txt 行数: $(wc -l < sources.txt)"
          # 手工源在网页上直接编辑 manual_sources.txt 提交即可，这里只做展示
          echo "manual_sources.txt 手工源条数: $(grep -v '^\s*#' manual_sources.txt 2>/dev/null | grep -v '^\s*$' | wc -l)"

      - name: 运行测活脚本
        run: python main.py

      # 报告写进本次运行的摘要，点开运行即可在页面顶部查看，不写回仓库文件
      - name: 输出测活报告到运行摘要
        if: always()
        run: |
          echo "## 本次测活报告" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/status.md ]; then
            cat output/status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> 未生成报告文件（脚本可能在报告写出前失败）。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 空订阅保护：抓不到源时不提交，避免把正常的订阅覆盖成 0 站
      - name: 校验并提交主订阅
        run: |
          python -c 'import json,sys; d=json.load(open("output/subscribe.json",encoding="utf-8")); n=len(d["sites"]); print("主订阅站点数:", n); sys.exit(1 if n==0 else 0)'
          git config user.name "subscribe-bot"
          git config user.email "subscribe-bot@users.noreply.github.com"
          git add output/subscribe.json
          if git diff --cached --quiet; then
            echo "订阅无变化，跳过提交"
          else
            git commit -m "chore: 自动更新订阅"
            git push origin HEAD:main
          fi

      # 成人订阅与报告含敏感内容，只作运行产物留存，不提交到公开仓库
      - name: 上传成人订阅与报告（私密产物）
        uses: actions/upload-artifact@v4
        with:
          name: private-output
          path: |
            output/subscribe_adult.json
            output/status.md
          if-no-files-found: ignore

      # 同步成人订阅到独立仓库（需配 ADULT_REPO_TOKEN 与 ADULT_REPO 两个 Secret）
      # 只公开 subscribe.json；测活报告 status.md 含站点明细，不对外公开
      # 未配置时自动跳过，不影响主流程
      - name: 同步成人订阅到独立仓库
        env:
          ADULT_REPO_TOKEN: ${{ secrets.ADULT_REPO_TOKEN }}
          ADULT_REPO: ${{ secrets.ADULT_REPO }}
        run: |
          if [ -z "$ADULT_REPO_TOKEN" ] || [ -z "$ADULT_REPO" ]; then
            echo "未配置 ADULT_REPO_TOKEN/ADULT_REPO，跳过同步"
            exit 0
          fi
          if [ ! -f output/subscribe_adult.json ]; then
            echo "无成人订阅文件，跳过"
            exit 0
          fi
          echo "同步成人订阅到 $ADULT_REPO ..."
          rm -rf /tmp/adult-repo
          git clone "https://x-access-token:${ADULT_REPO_TOKEN}@github.com/${ADULT_REPO}.git" /tmp/adult-repo
          cd /tmp/adult-repo
          git config user.name "subscribe-bot"
          git config user.email "subscribe-bot@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/output/subscribe_adult.json" ./subscribe.json
          # status.md 不再写回成人仓库，报告只留在运行摘要
          if git ls-files --error-unmatch status.md >/dev/null 2>&1; then
            git rm -f --cached status.md
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "成人订阅无变化，跳过提交"
          else
            git commit -m "chore: 自动更新成人订阅"
            git push origin HEAD:main
          fi
          echo "成人订阅已同步（仅 subscribe.json，不含报告）"
